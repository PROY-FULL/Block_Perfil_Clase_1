<div class="new-container">
  <div class="row">
    <div class="col-8">
      <mat-form-field appearance="outline">
        <mat-label>Filtro de Busqueda</mat-label>
        <input
          matInput
          (keyup)="applyFilter($event)"
          placeholder="Escribre el nombre o apellidos del paciente"
          #input
        />
      </mat-form-field>
    </div>
  </div>
  <div class="row">
    <div class="col-3">
      <button title="editar" class="btn-icon-nuevo" matFab (click)="openDialogNuevo()">
        <mat-icon class="icon_new">add</mat-icon>
      </button>
      <span class="span-titulo">Nueva Cita</span>
    </div>
  </div>
  <div class="row">
    <div class="mat-shadow-2">
      <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="acciones" class="container-acciones">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Acciones</th>
          <td mat-cell *matCellDef="let row">
            <button title="Editar" class="btn_editar" mat-mini-fab (click)="openDialog(row)">
              <mat-icon class="icon_edit">edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <!-- ID Column -->
        <ng-container matColumnDef="idCita" style="width: 10% !important">
          <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 10% !important">
            No. Cita
          </th>
          <td mat-cell *matCellDef="let row">{{ row.idCita }}</td>
        </ng-container>

        <ng-container matColumnDef="paciente" style="width: 30% !important">
          <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 30% !important">
            Paciente
          </th>
          <td mat-cell *matCellDef="let row">{{ row.paciente }}</td>
        </ng-container>

        <!-- Progress Column -->
        <ng-container matColumnDef="medico" style="width: 20% !important">
          <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 20% !important">
            Medico
          </th>
          <td mat-cell *matCellDef="let row">{{ row.medico }}</td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="fechaCita" style="width: 20% !important">
          <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 20% !important">
            Fecha Cita
          </th>
          <td mat-cell *matCellDef="let row">{{ row.fechaCita }}</td>
        </ng-container>

        <!-- Fruit Column -->
        <ng-container matColumnDef="estado" style="width: 20% !important">
          <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 20% !important">
            Estado Cita
          </th>
          <td mat-cell *matCellDef="let row">{{ row.estado }}</td>
        </ng-container>

        <!-- Telefono Column -->
        <ng-container matColumnDef="motivoConsulta" style="width: 10% !important">
          <th mat-header-cell *matHeaderCellDef mat-sort-header style="width: 10% !important">
            Motivo de Consulta
          </th>
          <td mat-cell *matCellDef="let row">{{ row.motivoConsulta }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4">No data matching the filter "{{ input.value }}"</td>
        </tr>
      </table>

      <mat-paginator
        [pageSizeOptions]="[5, 10, 25, 100]"
        aria-label="Select page of users"
      ></mat-paginator>
    </div>
  </div>
</div>
