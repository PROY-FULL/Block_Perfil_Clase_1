<mat-toolbar>
  <button matIconButton class="example-icon" aria-label="Example icon-button with menu icon">
    <mat-icon>medication</mat-icon>
  </button>
  <span>{{ titulo }}</span>
  <span class="spacer"></span>
  <button
    matIconButton
    class="example-icon favorite-icon"
    aria-label="Example icon-button with heart icon"
    (click)="closeDialog()"
  >
    <mat-icon>close</mat-icon>
  </button>
</mat-toolbar>
<div class="container">
  <form action="">
    <div class="row">
      <div class="col-12">
        <mat-form-field class="example-full-width">
          <mat-label>Buscar Paciente...</mat-label>
          <input
            type="text"
            matInput
            [formControl]="searchControl"
            [matAutocomplete]="autoPaciente"
          />
          <mat-autocomplete
            autoActiveFirstOption
            #autoPaciente="matAutocomplete"
            [displayWith]="displayFn"
          >
            @for (option of filteredOptions(); track option) {
              <mat-option [value]="option">{{ option }}</mat-option>
            } @empty {
              <mat-option disabled>No se encontraron resultados</mat-option>
            }
          </mat-autocomplete>
        </mat-form-field>
      </div>
    </div>
  </form>
</div>
