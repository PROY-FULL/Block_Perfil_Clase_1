<div class="app-container">
  <mat-toolbar class="app-toolbar">
    <button matIconButton (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <span>Sistema Clinico</span>
    <span class="spacer"></span>
    <button
      matIconButton
      class="example-icon favorite-icon"
      aria-label="Example icon-button with heart icon"
    >
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>
  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav #drawer opened="true" mode="side" class="app-sidenav">
      <mat-nav-list>
        <a mat-list-item routerLink="home">
          <mat-icon matListItemIcon>home</mat-icon>
          <span class="text-white" matListItemTitle>Inicio</span>
        </a>
        <a mat-list-item routerLink="pacientes">
          <mat-icon matListItemIcon>groups</mat-icon>
          <span class="text-white" matListItemTitle>Pacientes</span>
        </a>
        <a mat-list-item routerLink="home">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span class="text-white" matListItemTitle>Configuraciones</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="app-sidenav-content">
      <div>
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
