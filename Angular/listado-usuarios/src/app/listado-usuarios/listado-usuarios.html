<div class="row justify-content-center">
  <div class="col-md-6">
    <ul class="list-group">
      @if (usuarios.length > 0) {
        @for (usuario of usuarios; track usuario) {
          <li class="list-group-item text-danger">{{ usuario.id }} {{ usuario.name }}</li>
        }
      } @else {
        <li class="list-group-item text-danger">No hay usuarios</li>
      }
    </ul>
  </div>
</div>
